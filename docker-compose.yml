services:
  db:
    image: pgvector/pgvector:pg17
    container_name: de-santos-bolos-db
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: de_santos_bolos
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d de_santos_bolos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
